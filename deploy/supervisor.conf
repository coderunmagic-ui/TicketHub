[program:tickethub-notifications]
command=/usr/bin/php /var/www/tickethub/artisan queue:work redis --queue=notifications,default --sleep=1 --tries=5 --timeout=30 --max-jobs=1000
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=45
redirect_stderr=true
stdout_logfile=/var/www/tickethub/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:tickethub-scheduler]
command=/usr/bin/php /var/www/tickethub/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/www/tickethub/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
